<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#362b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c1240;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)" />

  <!-- Subtle ring accent -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.4"/>

  <!-- Corner bracket decoration - top left -->
  <path d="M 28 50 L 28 28 L 50 28" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Corner bracket decoration - bottom right -->
  <path d="M 172 150 L 172 172 L 150 172" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Monogram: M -->
  <text
    x="52"
    y="122"
    font-family="'Courier New', Courier, monospace"
    font-size="68"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-2"
  >M</text>

  <!-- Monogram: K -->
  <text
    x="116"
    y="122"
    font-family="'Courier New', Courier, monospace"
    font-size="68"
    font-weight="700"
    fill="#c4b5fd"
    letter-spacing="-2"
  >K</text>

  <!-- Thin underline accent -->
  <line x1="48" y1="132" x2="152" y2="132" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>

  <!-- Small label -->
  <text
    x="100"
    y="155"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    font-weight="400"
    fill="#94a3b8"
    text-anchor="middle"
    letter-spacing="3"
  >SDET · QA</text>
</svg>
